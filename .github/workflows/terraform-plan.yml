# Workflow: terraform-plan
# Executa terraform validate + plan em pull requests e manualmente via workflow_dispatch.
# Requer secrets configurados em Settings → Secrets and variables → Actions.
#
# Secrets AWS (credenciais temporárias do Learner Lab — renovar a cada sessão):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN
#
# Secrets Terraform (evitam prompt interativo de variáveis sensíveis):
#   TF_VAR_db_username, TF_VAR_db_password,
#   TF_VAR_moodle_admin_password, TF_VAR_repo_url, TF_VAR_ssh_allowed_cidr
#
# TODO: Configure os secrets acima em GitHub → Settings → Secrets and variables → Actions
#       antes de disparar este workflow.
#
# AVISO: Em pull requests vindos de forks, os secrets NÃO ficam disponíveis por segurança
#        do GitHub Actions. Use workflow_dispatch para rodar o plan com credenciais reais.
#        As credenciais do Learner Lab expiram a cada sessão (~4h) — renove antes de usar.

name: Terraform Plan

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-plan.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    env:
      TF_VAR_db_username:           ${{ secrets.TF_VAR_db_username }}
      TF_VAR_db_password:           ${{ secrets.TF_VAR_db_password }}
      TF_VAR_moodle_admin_password: ${{ secrets.TF_VAR_moodle_admin_password }}
      TF_VAR_repo_url:              ${{ secrets.TF_VAR_repo_url }}
      TF_VAR_ssh_allowed_cidr:      ${{ secrets.TF_VAR_ssh_allowed_cidr }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
          terraform_wrapper: true

      - name: Terraform Init
        run: terraform init -input=false
        working-directory: terraform

      - name: Terraform Validate
        run: terraform validate -no-color
        working-directory: terraform

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false
        working-directory: terraform
        continue-on-error: true

      - name: Publicar resultado do plan como comentário no PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN_STDOUT:  ${{ steps.plan.outputs.stdout }}
          PLAN_STDERR:  ${{ steps.plan.outputs.stderr }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const stdout  = process.env.PLAN_STDOUT  || '';
            const stderr  = process.env.PLAN_STDERR  || '';
            const outcome = process.env.PLAN_OUTCOME || '';
            const output  = [stdout, stderr].filter(Boolean).join('\n').slice(0, 60000);
            const body = [
              `## Terraform Plan`,
              `**Status:** \`${outcome}\``,
              ``,
              `\`\`\`hcl`,
              output,
              `\`\`\``,
            ].join('\n');
            await github.rest.issues.createComment({
              owner:    context.repo.owner,
              repo:     context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Verificar resultado do plan
        if: steps.plan.outcome == 'failure'
        run: |
          echo "Terraform plan falhou. Verifique o output acima."
          exit 1
